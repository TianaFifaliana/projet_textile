<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - AppTextile</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="login-box">
    <h1>AppTextile</h1>
    <p class="muted center">Veuillez vous authentifier</p>

    <div th:if="${param.error}" class="alert alert-error mb-2">
        Identifiants invalides ou compte désactivé.
    </div>
    <div th:if="${param.logout}" class="alert alert-ok mb-2">
        Vous avez été déconnecté.
    </div>

    <form th:action="@{/login}" method="post">
        <label>Utilisateur
            <input type="text" name="username" autofocus required>
        </label>
        <label>Mot de passe
            <input type="password" name="password" required>
        </label>
        <button type="submit" class="btn">Se connecter</button>
    </form>
</div>
</body>
</html>
