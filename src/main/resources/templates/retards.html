<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Commandes en retard - AppTextile</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="container">

    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}">erreur</div>

    <h1>Commandes en retard de livraison</h1>

    <div class="card mb-2" style="text-align:center">
        <p class="muted">Nombre de commandes en retard</p>
        <p class="retard-count" th:text="${commandesEnRetard != null ? commandesEnRetard.size() : 0}">0</p>
    </div>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>N&deg;</th>
                <th>Client</th>
                <th>Date commande</th>
                <th>Livraison prevue</th>
                <th>Priorite</th>
                <th>Statut</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${commandesEnRetard}" class="retard-row">
                <td th:text="${c.numero}">CMD-001</td>
                <td th:text="${c.client != null ? c.client.nom : '-'}">Client</td>
                <td th:text="${c.dateCommande != null ? #temporals.format(c.dateCommande, 'dd/MM/yyyy') : '-'}">-</td>
                <td th:text="${c.datePrevueLivraison != null ? #temporals.format(c.datePrevueLivraison, 'dd/MM/yyyy') : '-'}">-</td>
                <td>
                    <span th:text="${c.priorite}"
                          th:style="${c.priorite.name() == 'TRES_URGENTE'} ? 'color:#c0392b;font-weight:700' : ''">NORMALE</span>
                </td>
                <td>
                    <span th:text="${c.statut}"
                          th:classappend="'status status-' + ${c.statut}">EN_PRODUCTION</span>
                </td>
                <td><a class="btn btn-small btn-accent" th:href="@{/commandes/{id}(id=${c.id})}">Voir d&eacute;tail</a></td>
            </tr>
            <tr th:if="${commandesEnRetard == null || commandesEnRetard.isEmpty()}">
                <td colspan="7" class="muted center">Aucune commande en retard.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
